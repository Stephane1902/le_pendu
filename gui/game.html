<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hangman Game !</title>
        <link rel="stylesheet" href="/static/style.css" />
    </head>

    <body>
        <section id="jeu">
            <div id="contenu">
                <div id="barre">
                    <div class="pastille">
                        Error(s)
                        <strong id="erreurs">
                            <span id="error-count">0</span>/<span>6</span>
                        </strong>
                    </div>
                </div>

                <div class="carte">
                    <div id="pendu">
                        <svg
                            viewBox="0 0 160 200"
                            fill="none"
                            stroke="#334155"
                            stroke-width="5"
                            stroke-linecap="round"
                        >
                            <path d="M20 188 H80 M50 188 V20 H105 V45" />
                            <circle
                                class="hidden"
                                cx="105"
                                cy="58"
                                r="13"
                                id="hangman-head"
                            />
                            <line
                                class="hidden"
                                x1="105"
                                y1="71"
                                x2="105"
                                y2="120"
                                id="hangman-body"
                            />
                            <line
                                class="hidden"
                                x1="105"
                                y1="85"
                                x2="88"
                                y2="102"
                                id="hangman-left-arm"
                            />
                            <line
                                class="hidden"
                                x1="105"
                                y1="85"
                                x2="122"
                                y2="102"
                                id="hangman-right-arm"
                            />
                            <line
                                class="hidden"
                                x1="105"
                                y1="120"
                                x2="90"
                                y2="148"
                                id="hangman-left-leg"
                            />
                            <line
                                class="hidden"
                                x1="105"
                                y1="120"
                                x2="120"
                                y2="148"
                                id="hangman-right-leg"
                            />
                        </svg>
                    </div>

                    <div id="word-to-guess"></div>

                    <p class="resultat vert hidden" id="victory-message">
                        Victory !
                    </p>
                    <p class="resultat rouge hidden" id="defeat-message">
                        Too bad !
                    </p>
                </div>

                <div class="carte">
                    <div class="rangee">
                        <button class="touche">A</button>
                        <button class="touche">Z</button>
                        <button class="touche">E</button>
                        <button class="touche">R</button>
                        <button class="touche">T</button>
                        <button class="touche">Y</button>
                        <button class="touche">U</button>
                        <button class="touche">I</button>
                        <button class="touche">O</button>
                        <button class="touche">P</button>
                    </div>
                    <div class="rangee">
                        <button class="touche">Q</button>
                        <button class="touche">S</button>
                        <button class="touche">D</button>
                        <button class="touche">F</button>
                        <button class="touche">G</button>
                        <button class="touche">H</button>
                        <button class="touche">J</button>
                        <button class="touche">K</button>
                        <button class="touche">L</button>
                        <button class="touche">M</button>
                    </div>
                    <div class="rangee">
                        <button class="touche">W</button>
                        <button class="touche">X</button>
                        <button class="touche">C</button>
                        <button class="touche">V</button>
                        <button class="touche">B</button>
                        <button class="touche">N</button>
                    </div>
                </div>
            </div>
        </section>
    </body>

    <script type="text/javascript" src="/eel.js"></script>
    <script src="/scripts/game.js" defer></script>
</html>
